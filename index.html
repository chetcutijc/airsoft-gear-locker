<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gear Locker – Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --border: #1f2937;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 64px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    button, input, select {
      background: #1f2937;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
      font-weight: 600;
    }
    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h2 {
      font-size: 16px;
      margin: 0;
    }
    .card a.title-link {
      color: var(--accent);
      text-decoration: none;
    }
    .card a.title-link:hover {
      text-decoration: underline;
    }
    .field {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 6px;
      align-items: center;
      font-size: 13px;
    }
    .field label {
      color: var(--muted);
    }
    .field input, .field textarea {
      width: 100%;
      background: #0b1220;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
    }
    .field textarea {
      min-height: 48px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }
    .loading {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
  </style>
</head>
<body>
  <h1>Gear Locker – Products</h1>

  <div class="toolbar">
    <button id="refreshBtn" class="primary">Refresh</button>
    <button id="addProductBtn">Add product</button>
    <div id="globalStatus" class="status"></div>
  </div>

  <div id="grid" class="grid"></div>

  <script>
    const SUPABASE_URL = "https://jcheoqzbkfavjwuyesku.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5xj3YyY41_49kcQ6OQR4dg_lbf1ryRl";

    const grid = document.getElementById("grid");
    const globalStatus = document.getElementById("globalStatus");
    const refreshBtn = document.getElementById("refreshBtn");
    const addProductBtn = document.getElementById("addProductBtn");

    let products = [];

    async function fetchProducts() {
      grid.innerHTML = '<div class="loading">Loading products…</div>';
      globalStatus.textContent = "";
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/products?order=created_at.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "count=exact"
          }
        });
        if (!res.ok) throw new Error("Failed to load products");
        products = await res.json();
        render();
      } catch (err) {
        grid.innerHTML = "";
        globalStatus.textContent = "Error loading products: " + err.message;
      }
    }

    function render() {
      grid.innerHTML = "";
      if (!products.length) {
        grid.innerHTML = '<div class="loading">No products yet.</div>';
        return;
      }
      for (const p of products) {
        grid.appendChild(renderCard(p));
      }
    }

    function renderCard(product) {
      const card = document.createElement("div");
      card.className = "card";

      const titleRow = document.createElement("div");
      titleRow.style.display = "flex";
      titleRow.style.justifyContent = "space-between";
      titleRow.style.alignItems = "center";
      titleRow.style.gap = "8px";

      const titleLink = document.createElement("a");
      titleLink.className = "title-link";
      titleLink.textContent = product.title || "(no title)";
      titleLink.href = product.source_url || "#";
      titleLink.target = "_blank";
      titleLink.rel = "noopener noreferrer";
      titleRow.appendChild(titleLink);

      const idLabel = document.createElement("div");
      idLabel.style.fontSize = "12px";
      idLabel.style.color = "var(--muted)";
      idLabel.textContent = "id: " + product.id;
      titleRow.appendChild(idLabel);

      card.appendChild(titleRow);

      const fields = [
        { key: "title", label: "Title", type: "text" },
        { key: "description", label: "Description", type: "textarea" },
        { key: "price", label: "Price", type: "text" },
        { key: "currency", label: "Currency", type: "text" },
        { key: "image_url", label: "Image URL", type: "text" },
        { key: "source_url", label: "Source URL", type: "text" }
      ];

      const inputs = {};

      for (const f of fields) {
        const row = document.createElement("div");
        row.className = "field";

        const label = document.createElement("label");
        label.textContent = f.label;
        row.appendChild(label);

        let input;
        if (f.type === "textarea") {
          input = document.createElement("textarea");
        } else {
          input = document.createElement("input");
          input.type = f.type === "text" ? "text" : f.type;
        }
        input.value = product[f.key] ?? "";
        row.appendChild(input);
        card.appendChild(row);
        inputs[f.key] = input;
      }

      const actions = document.createElement("div");
      actions.className = "actions";

      const saveBtn = document.createElement("button");
      saveBtn.textContent = "Save";
      saveBtn.className = "primary";

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.className = "danger";

      const status = document.createElement("div");
      status.className = "status";

      actions.appendChild(saveBtn);
      actions.appendChild(deleteBtn);
      card.appendChild(actions);
      card.appendChild(status);

      saveBtn.addEventListener("click", async () => {
        status.textContent = "Saving…";
        const updates = {};
        for (const f of fields) {
          updates[f.key] = inputs[f.key].value;
        }
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${product.id}`, {
            method: "PATCH",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(updates)
          });
          if (!res.ok) throw new Error("Save failed");
          status.textContent = "Saved";
          setTimeout(() => (status.textContent = ""), 1500);
          Object.assign(product, updates);
          titleLink.textContent = product.title || "(no title)";
          titleLink.href = product.source_url || "#";
        } catch (err) {
          status.textContent = "Error: " + err.message;
        }
      });

      deleteBtn.addEventListener("click", async () => {
        if (!confirm("Delete this product?")) return;
        status.textContent = "Deleting…";
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${product.id}`, {
            method: "DELETE",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Prefer": "return=minimal"
            }
          });
          if (!res.ok) throw new Error("Delete failed");
          products = products.filter(p => p.id !== product.id);
          render();
          globalStatus.textContent = "Product deleted";
          setTimeout(() => (globalStatus.textContent = ""), 2000);
        } catch (err) {
          status.textContent = "Error: " + err.message;
        }
      });

      return card;
    }

    async function addProduct() {
      globalStatus.textContent = "Creating product…";
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({
            title: "New product",
            description: "",
            price: null,
            currency: null,
            image_url: null,
            source_url: null
          })
        });
        if (!res.ok) throw new Error("Create failed");
        const [created] = await res.json();
        products.unshift(created);
        render();
        globalStatus.textContent = "Product created";
        setTimeout(() => (globalStatus.textContent = ""), 2000);
      } catch (err) {
        globalStatus.textContent = "Error creating product: " + err.message;
      }
    }

    refreshBtn.addEventListener("click", fetchProducts);
    addProductBtn.addEventListener("click", addProduct);

    fetchProducts();
  </script>
</body>
</html>
