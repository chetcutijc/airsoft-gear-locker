<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gear Locker</title><style>body{font-family:system-ui;margin:0;background:#f5f3ed;color:#24251f}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d4cfc2;border-radius:14px;padding:16px;margin:14px 0}input,select,textarea,button{font:inherit;padding:9px;margin:4px 0;max-width:100%;box-sizing:border-box}input,select,textarea{width:100%}button{background:#56632f;color:#fff;border:0;border-radius:8px}.hidden{display:none}.grid{display:grid;gap:10px}@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}.item{border-top:1px solid #ddd;padding:10px 0}.muted{color:#666}</style></head><body><main class="wrap"><h1>Gear Locker</h1><p>Private cross-device gear and shopping tracker.</p><section class="card" id="auth"><h2>Sign in</h2><input id="email" type="email" placeholder="you@example.com"><button id="login">Email me a sign-in link</button><p id="authmsg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><button id="logout">Sign out</button><p id="who"></p><div class="grid"><div><h2 id="gearCount">0 gear items</h2><p id="attention" class="muted"></p></div><div><h2 id="shopCount">0 open purchases</h2><p id="high" class="muted"></p></div></div></div><section class="card"><h2>Add gear</h2><form id="gearForm"><div class="grid"><input name="name" required placeholder="Item name, e.g. SSP5"><select name="category"><option value="replica">Replica</option><option value="magazine">Magazine</option><option value="holster">Holster</option><option value="eye_protection">Eye protection</option><option value="face_protection">Face protection</option><option value="gas">Gas</option><option value="bbs">BBs</option><option value="accessory">Accessory</option><option value="other">Other</option></select><select name="status"><option value="active">Active</option><option value="needs_attention">Needs attention</option><option value="retired">Retired</option></select><input name="brand" placeholder="Brand (optional)"></div><textarea name="notes" placeholder="Notes (optional)"></textarea><button>Add gear</button></form><div id="gearList"></div></section><section class="card"><h2>Shopping list</h2><form id="shopForm"><div class="grid"><input name="name" required placeholder="Item to buy"><select name="priority"><option value="low">Low priority</option><option value="medium" selected>Medium priority</option><option value="high">High priority</option></select><input name="estimated_cost" inputmode="decimal" type="number" min="0" step="0.01" placeholder="Estimated cost (optional)"></div><textarea name="reason" placeholder="Why do you need it? (optional)"></textarea><button>Add to shopping list</button></form><div id="shopList"></div></section><section class="card"><h2>Storage checklist</h2><p>Keep the replica unloaded and secured; store gas upright, cool, and separate from the case; protect eye and face gear from crushing and heat.</p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://jcheoqzbkfavjwuyesku.supabase.co','sb_publishable_5xj3YyY41_49kcQ6OQR4dg_lbf1ryRl');const $=x=>document.querySelector(x);function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){let{data:{user}}=await sb.auth.getUser();$('#auth').classList.toggle('hidden',!!user);$('#app').classList.toggle('hidden',!user);if(!user)return;$('#who').textContent='Signed in as '+user.email;let[{data:g,error:ge},{data:s,error:se}]=await Promise.all([sb.from('gear_items').select('*').order('created_at',{ascending:false}),sb.from('shopping_items').select('*').order('created_at',{ascending:false})]);if(ge||se)alert((ge||se).message);g=g||[];s=s||[];$('#gearCount').textContent=g.length+' gear item'+(g.length===1?'':'s');$('#attention').textContent=g.filter(x=>x.status==='needs_attention').length+' need attention';$('#shopCount').textContent=s.filter(x=>!x.purchased).length+' open purchase'+(s.filter(x=>!x.purchased).length===1?'':'s');$('#high').textContent=s.filter(x=>!x.purchased&&x.priority==='high').length+' high priority';$('#gearList').innerHTML=g.map(x=>`<div class=item><b>${esc(x.name)}</b> · ${esc(x.category)} · ${esc(x.status)}<br><span class=muted>${esc(x.brand||'')}${x.notes?' — '+esc(x.notes):''}</span><br><button data-del-gear="${x.id}">Delete</button></div>`).join('')||'<p class=muted>No gear added yet.</p>';$('#shopList').innerHTML=s.map(x=>`<div class=item><label><input type=checkbox data-buy="${x.id}" ${x.purchased?'checked':''}> <b>${esc(x.name)}</b></label> · ${esc(x.priority)}${x.estimated_cost!=null?' · '+esc(x.estimated_cost):''}<br><span class=muted>${esc(x.reason||'')}</span><br><button data-del-shop="${x.id}">Delete</button></div>`).join('')||'<p class=muted>No shopping items yet.</p>'}$('#login').onclick=async()=>{let email=$('#email').value.trim();if(!email)return;let{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://chetcutijc.github.io/airsoft-gear-locker/'}});$('#authmsg').textContent=error?error.message:'Check your email for the sign-in link.'};$('#logout').onclick=async()=>{await sb.auth.signOut();load()};$('#gearForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);let{error}=await sb.from('gear_items').insert(o);if(error)alert(error.message);else{e.target.reset();load()}};$('#shopForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.estimated_cost=o.estimated_cost===''?null:Number(o.estimated_cost);let{error}=await sb.from('shopping_items').insert(o);if(error)alert(error.message);else{e.target.reset();load()}};document.addEventListener('click',async e=>{let id=e.target.dataset.delGear||e.target.dataset.delShop;if(id){let t=e.target.dataset.delGear?'gear_items':'shopping_items';if(confirm('Delete this item?')){let{error}=await sb.from(t).delete().eq('id',id);if(error)alert(error.message);load()}}});document.addEventListener('change',async e=>{let id=e.target.dataset.buy;if(id){let{error}=await sb.from('shopping_items').update({purchased:e.target.checked,purchased_on:e.target.checked?new Date().toISOString().slice(0,10):null}).eq('id',id);if(error)alert(error.message);load()}});sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();</script></body></html>
