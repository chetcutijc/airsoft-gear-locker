<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gear Locker</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #172033;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #263247;
      --accent: #22c55e;
      --accent-dark: #052e16;
      --danger: #fca5a5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.1;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    p { line-height: 1.45; }

    .subtitle, small {
      color: var(--muted);
    }

    .hidden { display: none !important; }

    .panel {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .identity {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .auth-fields {
      display: grid;
      gap: 10px;
      max-width: 420px;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 9px;
      color: var(--text);
      background: #0b1220;
      font: inherit;
    }

    button {
      min-height: 42px;
      padding: 10px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-dark);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button.secondary {
      background: #263247;
      color: var(--text);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 1.4em;
      margin: 12px 0 0;
      color: var(--muted);
    }

    .error { color: var(--danger); }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .item:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .item-title {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .notes {
      margin: 8px 0 0;
      white-space: pre-wrap;
    }

    a {
      color: #4ade80;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Gear Locker</h1>
      <p class="subtitle">Track your current airsoft gear and shopping list.</p>
    </header>

    <section id="authPanel" class="panel">
      <h2>Sign in</h2>
      <p class="subtitle">
        Sign in with the Supabase account that owns your Gear Locker data.
      </p>

      <div class="auth-fields">
        <input id="email" type="email" autocomplete="email" placeholder="Email address" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button id="signInButton" type="button">Sign in</button>
      </div>

      <p id="authStatus" class="status" aria-live="polite"></p>
    </section>

    <section id="app" class="hidden">
      <div class="panel toolbar">
        <div>
          <div class="identity">Signed in as <span id="userEmail"></span></div>
          <small>Your records remain protected by Supabase row-level security.</small>
        </div>
        <div>
          <button id="refreshButton" class="secondary" type="button">Refresh</button>
          <button id="signOutButton" class="secondary" type="button">Sign out</button>
        </div>
      </div>

      <section class="panel">
        <h2>Current Gear</h2>
        <div id="gearList" class="list"></div>
      </section>

      <section class="panel">
        <h2>Shopping List</h2>
        <div id="shoppingList" class="list"></div>
      </section>

      <p id="appStatus" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://jcheoqzbkfavjwuyesku.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5xj3YyY41_49kcQ6OQR4dg_lbf1ryRl";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const authPanel = document.getElementById("authPanel");
    const app = document.getElementById("app");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const signInButton = document.getElementById("signInButton");
    const signOutButton = document.getElementById("signOutButton");
    const refreshButton = document.getElementById("refreshButton");
    const authStatus = document.getElementById("authStatus");
    const appStatus = document.getElementById("appStatus");
    const userEmail = document.getElementById("userEmail");
    const gearList = document.getElementById("gearList");
    const shoppingList = document.getElementById("shoppingList");

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = value ?? "";
      return element.innerHTML;
    }

    function sourceLink(url) {
      if (!url) return "";
      return ` · <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Source</a>`;
    }

    function showError(target, message) {
      target.classList.add("error");
      target.textContent = message;
    }

    function showStatus(target, message) {
      target.classList.remove("error");
      target.textContent = message;
    }

    function renderGear(items) {
      if (!items.length) {
        gearList.innerHTML = "<p class=\"subtitle\">No current gear yet.</p>";
        return;
      }

      gearList.innerHTML = items.map((item) => {
        const details = [
          item.category,
          item.brand,
          item.model,
          item.status,
          item.price != null ? `Price: ${item.price}` : null,
          item.availability
        ].filter(Boolean).map(escapeHtml).join(" · ");

        return `
          <article class="item">
            <h3 class="item-title">${escapeHtml(item.name)}</h3>
            <div class="meta">${details}${sourceLink(item.source_url)}</div>
            ${item.notes ? `<p class="notes">${escapeHtml(item.notes)}</p>` : ""}
          </article>
        `;
      }).join("");
    }

    function renderShopping(items) {
      if (!items.length) {
        shoppingList.innerHTML = "<p class=\"subtitle\">No shopping items yet.</p>";
        return;
      }

      shoppingList.innerHTML = items.map((item) => {
        const cost = item.price ?? item.estimated_cost;
        const details = [
          item.category,
          item.priority ? `Priority: ${item.priority}` : null,
          item.status,
          item.purchased ? "Purchased" : null,
          cost != null ? `Price: ${cost}` : null,
          item.availability
        ].filter(Boolean).map(escapeHtml).join(" · ");

        return `
          <article class="item">
            <h3 class="item-title">${escapeHtml(item.name)}</h3>
            <div class="meta">${details}${sourceLink(item.source_url || item.url)}</div>
            ${item.reason ? `<p class="notes">${escapeHtml(item.reason)}</p>` : ""}
            ${item.notes ? `<p class="notes">${escapeHtml(item.notes)}</p>` : ""}
          </article>
        `;
      }).join("");
    }

    async function loadDashboard() {
      const { data: { user } } = await supabase.auth.getUser();

      authPanel.classList.toggle("hidden", Boolean(user));
      app.classList.toggle("hidden", !user);

      if (!user) {
        gearList.innerHTML = "";
        shoppingList.innerHTML = "";
        return;
      }

      userEmail.textContent = user.email || "Signed-in user";
      showStatus(appStatus, "Loading your gear…");

      const [gearResponse, shoppingResponse] = await Promise.all([
        supabase.from("gear_items").select("*").order("created_at", { ascending: false }),
        supabase.from("shopping_items").select("*").order("created_at", { ascending: false })
      ]);

      if (gearResponse.error || shoppingResponse.error) {
        const error = gearResponse.error || shoppingResponse.error;
        showError(appStatus, `Could not load your data: ${error.message}`);
        gearList.innerHTML = "";
        shoppingList.innerHTML = "";
        return;
      }

      renderGear(gearResponse.data || []);
      renderShopping(shoppingResponse.data || []);
      showStatus(appStatus, "");
    }

    async function signIn() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError(authStatus, "Enter both your email address and password.");
        return;
      }

      signInButton.disabled = true;
      showStatus(authStatus, "Signing in…");

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      signInButton.disabled = false;

      if (error) {
        showError(authStatus, error.message);
        return;
      }

      passwordInput.value = "";
      showStatus(authStatus, "");
      await loadDashboard();
    }

    signInButton.addEventListener("click", signIn);

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") signIn();
    });

    refreshButton.addEventListener("click", loadDashboard);

    signOutButton.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showStatus(authStatus, "");
      await loadDashboard();
    });

    supabase.auth.onAuthStateChange(() => {
      loadDashboard();
    });

    loadDashboard();
  </script>
</body>
</html>
